services:
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: shopflow-api
    command:
      - sh
      - -lc
      - pnpm exec typeorm -d dist/database/data-source.js migration:run && node dist/main.js
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: 'true'
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: shopflow
      DB_PASSWORD: shopflow_secret
      DB_NAME: shopflow_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: change_me_access_32_chars_minimum
      JWT_REFRESH_SECRET: change_me_refresh_32_chars_minimum
      PAYSTACK_SECRET_KEY: sk_test_xxxx
      PAYSTACK_WEBHOOK_SECRET: whsec_xxxx
    restart: unless-stopped
    labels:
      logging: 'promtail'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: shopflow-frontend
    ports:
      - '3002:3000'
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      logging: 'promtail'

  postgres:
    image: postgres:16-alpine
    container_name: shopflow-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow_secret
      POSTGRES_DB: shopflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopflow -d shopflow_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: shopflow-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: shopflow-grafana
    ports:
      - '3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: shopflow-loki
    ports:
      - '3100:3100'
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: shopflow-promtail
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

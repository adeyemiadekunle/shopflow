name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: shopflow_secret
          POSTGRES_DB: shopflow_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shopflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: shopflow
      DB_PASSWORD: shopflow_secret
      DB_NAME: shopflow_db_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: test_access_secret_32_characters
      JWT_REFRESH_SECRET: test_refresh_secret_32_characters
      PAYSTACK_SECRET_KEY: sk_test_dummy
      PAYSTACK_WEBHOOK_SECRET: whsec_dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test -- --coverage --passWithNoTests

      - name: Build
        run: pnpm build

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - name: Build Docker image
        run: docker build -f apps/backend/Dockerfile -t shopflow-api:${{ github.sha }} .
